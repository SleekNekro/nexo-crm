services:
  app:
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 2g
    cpus: 2
    pids_limit: 512
    image: ghcr.io/sleeknekro/nexo-crm:app-0.2.0-beta.4
    restart: unless-stopped
    ports:
      - '127.0.0.1:${ADMIN_PORT:-8182}:3000'
    environment:
      DATABASE_URL: postgres://crm_runtime:${CRM_RUNTIME_PASSWORD:?Ejecuta scripts/provision-runtime.py}@db:5432/crm
      CRM_PDF_SOCKET: /run/crm-pdf/render.sock
      UPLOAD_DIR: /app/storage/photos
      CRM_PUBLIC_URL: ${CRM_PUBLIC_URL:-http://localhost:8180}
      CRM_REMINDER_TOKEN: ${CRM_REMINDER_TOKEN:-}
      CRM_GATEWAY_URL: http://gateway:8090
      CRM_GATEWAY_TOKEN: ${CRM_GATEWAY_TOKEN:?Configura CRM_GATEWAY_TOKEN}
      CRM_DEPLOYMENT_ID: ${CRM_DEPLOYMENT_ID:?Configura CRM_DEPLOYMENT_ID}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      AUTH_ENCRYPTION_KEY: ${AUTH_ENCRYPTION_KEY:?Configura AUTH_ENCRYPTION_KEY en .env}
    volumes:
      - crm_photos:/app/storage
      - crm_pdf_socket:/run/crm-pdf
    depends_on:
      pdf:
        condition: service_started
      db:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
  pdf:
    image: ghcr.io/sleeknekro/nexo-crm:pdf-0.2.0-beta.4
    network_mode: none
    restart: unless-stopped
    user: node
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
      - /home/node:size=32m,uid=1000,gid=1000
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 768m
    cpus: 1
    pids_limit: 256
    volumes:
      - crm_pdf_socket:/run/crm-pdf
    logging:
      driver: json-file
      options:
        max-size: '5m'
        max-file: '2'
  gateway:
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 64
    image: ghcr.io/sleeknekro/nexo-crm:gateway-0.2.0-beta.4
    restart: unless-stopped
    ports:
      - '127.0.0.1:${APP_PORT:-8180}:8080'
    environment:
      CRM_GATEWAY_TOKEN: ${CRM_GATEWAY_TOKEN:?Configura CRM_GATEWAY_TOKEN}
      CRM_DEPLOYMENT_ID: ${CRM_DEPLOYMENT_ID:?Configura CRM_DEPLOYMENT_ID}
      CRM_PUBLIC_URL: ${CRM_PUBLIC_URL:-http://localhost:8180}
    volumes:
      - crm_gateway:/data
    depends_on:
      - app
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
  db:
    mem_limit: 1g
    pids_limit: 256
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: crm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configura POSTGRES_PASSWORD en .env}
      POSTGRES_DB: crm
    volumes:
      - crm_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U crm']
      interval: 5s
      retries: 15
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
volumes:
  crm_pdf_socket:
  crm_gateway:
  crm_data:
  crm_photos:
