<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Conectar · NEXO CRM</title>
<style>body{font:17px system-ui;background:#eff6ff;color:#172554;margin:0;padding:40px}main{max-width:480px;margin:auto}h1{color:#2563eb}label{display:block;margin:20px 0 8px}input[type=url]{box-sizing:border-box;width:100%;padding:14px;border:1px solid #94a3b8;border-radius:8px;font:inherit}button{font:inherit;background:#2563eb;color:white;padding:14px 24px;border:0;border-radius:8px;margin-top:20px;cursor:pointer}button:disabled{opacity:.5}#error{color:#b91c1c}small{color:#475569}</style></head>
<body><main><h1>NEXO CRM <small>Beta</small></h1><p>Tu CRM, en una aplicación.</p><p>Conecta con un servidor Nexo ya instalado. Esta aplicación no incluye el servidor ni la base de datos.</p>
<form id="connect"><label for="server">Dirección del servidor</label><input id="server" type="url" placeholder="https://crm.example.com" required><label><input id="local" type="checkbox"> Permitir HTTP en mi red local (sin cifrado)</label><small>Usa HTTPS para datos reales. Si instalaste Nexo en este ordenador, la dirección habitual de prueba es http://localhost:8180.</small><br><button id="submit">Conectar</button><p id="error" role="alert"></p></form></main>
<script>function showError(message){document.getElementById('error').textContent=message;document.getElementById('submit').disabled=false}document.getElementById('connect').addEventListener('submit',event=>{event.preventDefault();document.getElementById('submit').disabled=true;const params=new URLSearchParams({url:document.getElementById('server').value.trim(),local:document.getElementById('local').checked?'1':'0'});location.href='nexo-setup://connect?'+params});</script></body></html>
