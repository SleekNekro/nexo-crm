plugins { id 'com.android.application' }
android {
    namespace 'com.nexo.crm'
    compileSdk 35
    defaultConfig { applicationId 'com.nexo.crm'; minSdk 26; targetSdk 35; versionCode 2; versionName '0.1.1' }
    buildFeatures { buildConfig true }
    def crmServer = providers.gradleProperty('crmServer').getOrElse('')
    if (crmServer && !(crmServer ==~ /https?:\/\/[a-zA-Z0-9.:-]+\/?/)) throw new GradleException('Servidor no válido')
    defaultConfig { buildConfigField 'String', 'DEFAULT_SERVER', '"' + crmServer + '"' }
    buildTypes {
        debug { applicationIdSuffix '.debug'; manifestPlaceholders = [cleartext: 'true'] }
        release { minifyEnabled false; manifestPlaceholders = [cleartext: 'false'] }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
