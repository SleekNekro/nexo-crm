plugins { id 'com.android.application' }
android {
    namespace 'com.nexo.crm'
    compileSdk 35
    defaultConfig { applicationId 'com.nexo.crm'; minSdk 26; targetSdk 35; versionCode 6; versionName '0.2.0-beta.4' }
    buildFeatures { buildConfig true }
    def crmServer = providers.gradleProperty('crmServer').getOrElse('')
    if (crmServer && !(crmServer ==~ /https?:\/\/[a-zA-Z0-9.:-]+\/?/)) throw new GradleException('Servidor no válido')
    defaultConfig { buildConfigField 'String', 'DEFAULT_SERVER', '"' + crmServer + '"' }
    signingConfigs {
        beta {
            if (System.getenv('ANDROID_KEYSTORE_PATH')) {
                storeFile file(System.getenv('ANDROID_KEYSTORE_PATH'))
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias 'nexo-beta'
                keyPassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
            }
        }
    }
    buildTypes {
        debug { applicationIdSuffix '.debug'; manifestPlaceholders = [cleartext: 'true'] }
        release { applicationIdSuffix '.beta'; if (System.getenv('ANDROID_KEYSTORE_PATH')) signingConfig signingConfigs.beta; minifyEnabled false; manifestPlaceholders = [cleartext: 'false'] }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
