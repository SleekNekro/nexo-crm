name: Release beta
on:
  workflow_dispatch:
    inputs:
      android_only:
        description: Compilar solo Android (los paquetes se publican tras revisión y firma local)
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: release-beta
  cancel-in-progress: false
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run audit:public
      - run: npm test
      - run: npm run build
      - run: npm run typecheck
  desktop:
    if: ${{ !inputs.android_only }}
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            label: Apple-Silicon
          - os: macos-latest
            target: x86_64-apple-darwin
            label: Intel
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            label: Windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: npm ci
        working-directory: apps/desktop
      - run: cargo test --locked --release
        working-directory: apps/desktop/src-tauri
      - name: Build Mac
        if: runner.os == 'macOS'
        run: npx tauri build --target ${{ matrix.target }} --bundles app
        working-directory: apps/desktop
      - name: Package Mac
        if: runner.os == 'macOS'
        run: |
          mkdir -p dist
          APP="apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/macos/NEXO CRM.app"
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --strict "$APP"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "dist/Nexo-CRM-macOS-${{ matrix.label }}.zip"
          COPYFILE_DISABLE=1 tar -czf "dist/Nexo-CRM-macOS-${{ matrix.label }}.app.tar.gz" -C "$(dirname "$APP")" "NEXO CRM.app"
      - name: Build Windows
        if: runner.os == 'Windows'
        run: npx tauri build --target ${{ matrix.target }} --bundles nsis --config ../windows/tauri.windows.conf.json
        working-directory: apps/desktop
      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist
          Copy-Item 'apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe' dist/
      - uses: actions/upload-artifact@v4
        with:
          name: client-${{ matrix.label }}
          path: dist/*
          if-no-files-found: error
  android:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Build unsigned APK
        working-directory: apps/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease lintRelease
      - name: Package unsigned APK for local signing
        run: |
          mkdir -p dist
          cp apps/android/app/build/outputs/apk/release/*unsigned.apk dist/Nexo-CRM-Android-unsigned.apk
      - uses: actions/upload-artifact@v4
        with:
          name: unsigned-Android
          path: dist/*
          if-no-files-found: error
