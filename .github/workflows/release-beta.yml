name: Release beta
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-beta
  cancel-in-progress: false
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run audit:public
      - run: npm test
      - run: npm run build
      - run: npm run typecheck
  desktop:
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            label: Apple-Silicon
          - os: macos-latest
            target: x86_64-apple-darwin
            label: Intel
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            label: Windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: npm ci
        working-directory: apps/desktop
      - run: cargo test --locked
        working-directory: apps/desktop/src-tauri
      - name: Build Mac
        if: runner.os == 'macOS'
        run: npx tauri build --target ${{ matrix.target }} --bundles app
        working-directory: apps/desktop
      - name: Package Mac
        if: runner.os == 'macOS'
        run: |
          mkdir -p dist
          APP="apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/macos/NEXO CRM.app"
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --strict "$APP"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "dist/Nexo-CRM-macOS-${{ matrix.label }}.zip"
      - name: Build Windows
        if: runner.os == 'Windows'
        run: npx tauri build --target ${{ matrix.target }} --bundles nsis --config ../windows/tauri.windows.conf.json
        working-directory: apps/desktop
      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist
          Copy-Item 'apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe' dist/
      - uses: actions/upload-artifact@v4
        with:
          name: client-${{ matrix.label }}
          path: dist/*
          if-no-files-found: error
  android:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - name: Restore beta key
        env:
          KEYSTORE: ${{ secrets.ANDROID_BETA_KEYSTORE }}
        run: printf '%s' "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/nexo-beta.jks"
      - name: Build signed APK
        working-directory: apps/android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/nexo-beta.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_BETA_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease lintRelease
      - name: Verify APK
        run: |
          mkdir -p dist
          cp apps/android/app/build/outputs/apk/release/*.apk dist/Nexo-CRM-Android-beta.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose dist/Nexo-CRM-Android-beta.apk
      - uses: actions/upload-artifact@v4
        with:
          name: client-Android
          path: dist/*
          if-no-files-found: error
      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/nexo-beta.jks"
  publish:
    needs: [desktop, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: client-*
          merge-multiple: true
          path: dist
      - run: sha256sum * > SHA256SUMS.txt
        working-directory: dist
      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create v0.2.0-beta.1 dist/* --target "$GITHUB_SHA" --prerelease --title 'Nexo CRM v0.2.0-beta.1' --notes-file docs/release-notes/v0.2.0-beta.1.md
