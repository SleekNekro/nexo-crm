name: nexo-portfolio
services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - '127.0.0.1:${ADMIN_PORT:-8182}:3000'
    environment:
      DATABASE_URL: postgres://crm:${POSTGRES_PASSWORD}@db:5432/crm
      UPLOAD_DIR: /app/storage/photos
      CRM_PUBLIC_URL: ${CRM_PUBLIC_URL:-http://localhost:8180}
      CRM_REMINDER_TOKEN: ${CRM_REMINDER_TOKEN:-}
      CRM_GATEWAY_URL: http://gateway:8090
      CRM_GATEWAY_TOKEN: ${CRM_GATEWAY_TOKEN:?Configura CRM_GATEWAY_TOKEN}
      CRM_DEPLOYMENT_ID: ${CRM_DEPLOYMENT_ID:?Configura CRM_DEPLOYMENT_ID}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      AUTH_ENCRYPTION_KEY: ${AUTH_ENCRYPTION_KEY:?Configura AUTH_ENCRYPTION_KEY en .env}
    volumes:
      - crm_photos:/app/storage
    depends_on:
      db:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
  reminders:
    profiles: ['reminders']
    build: ./services/reminders
    restart: unless-stopped
    environment:
      CRM_REMINDER_TOKEN: ${CRM_REMINDER_TOKEN:-}
    depends_on:
      - app
    logging:
      driver: json-file
      options:
        max-size: '5m'
        max-file: '2'
  gateway:
    build: ./services/gateway
    restart: unless-stopped
    ports:
      - '${BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-8180}:8080'
    environment:
      CRM_GATEWAY_TOKEN: ${CRM_GATEWAY_TOKEN:?Configura CRM_GATEWAY_TOKEN}
      CRM_DEPLOYMENT_ID: ${CRM_DEPLOYMENT_ID:?Configura CRM_DEPLOYMENT_ID}
      CRM_PUBLIC_URL: ${CRM_PUBLIC_URL:-http://localhost:8180}
    volumes:
      - crm_gateway:/data
    depends_on:
      - app
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
  db:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: crm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configura POSTGRES_PASSWORD en .env}
      POSTGRES_DB: crm
    volumes:
      - crm_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U crm']
      interval: 5s
      retries: 15
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
volumes:
  crm_gateway:
  crm_data:
  crm_photos:
